<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadoraverse Lore Vault</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="logo">KADORAVERSE</div>

        <div class="header-search">
            <input type="text" placeholder="Search..." aria-label="Search">
        </div>
    </header>

    <main class="home-page">

        <section class="hero">
            <h1>LORE VAULT</h1>
            <p>Your universe, organized.</p>

            <div class="main-search">
                <input 
                    type="text" 
                    placeholder="Search characters, places, lore..."
                    aria-label="Search Kadoraverse"
                >
            </div>
        </section>

        <section class="recent-section">
            <div class="section-heading">
                <h2>Recent Characters</h2>
            </div>

            <div class="character-grid">

                <button class="character-card">
                    <div class="character-image">
                        <span>THERON</span>
                    </div>
                    <div class="character-name">Theron</div>
                </button>

                <button class="character-card">
                    <div class="character-image">
                        <span>CHERRY</span>
                    </div>
                    <div class="character-name">Cherry Kuro</div>
                </button>

                <button class="character-card">
                    <div class="character-image">
                        <span>FREY</span>
                    </div>
                    <div class="character-name">Frey</div>
                </button>

            </div>
        </section>

        <section class="create-section">
            <button class="create-button">
                + Create Character
            </button>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
